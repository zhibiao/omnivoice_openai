[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnivoice-openai"
version = "1.0.0"
description = "Standalone OmniVoice OpenAI-compatible text-to-speech service"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.10,<2",
    "fastapi>=0.115,<1",
    "huggingface-hub>=0.34,<3",
    "librosa>=0.11,<1",
    "num2words>=0.5.14,<1",
    "numpy>=2,<3",
    "pydantic>=2.10,<3",
    "pydub>=0.25,<1",
    "soundfile>=0.13,<1",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers>=5.3,<6",
    "uvicorn>=0.34,<1",
    "WeTextProcessing>=1.3,<2",
]

[project.optional-dependencies]
flashinfer = [
    "flashinfer-python==0.6.15.post1",
    "flashinfer-jit-cache @ https://github.com/flashinfer-ai/flashinfer/releases/download/v0.6.15.post1/flashinfer_jit_cache-0.6.15.post1+cu129-cp39-abi3-manylinux_2_28_x86_64.whl",
]

[project.scripts]
omnivoice-server = "omnivoice_server:main"
omnivoice-infer = "inference:main"

[tool.uv.sources]
torch = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux'" },
]
torchaudio = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.hatch.build.targets.sdist]
include = [
    "omnivoice.py",
    "omnivoice_flashinfer.py",
    "inference.py",
    "omnivoice_server.py",
    "web",
]

[tool.hatch.build.targets.wheel]
only-include = [
    "omnivoice.py",
    "omnivoice_flashinfer.py",
    "inference.py",
    "omnivoice_server.py",
    "web",
]
